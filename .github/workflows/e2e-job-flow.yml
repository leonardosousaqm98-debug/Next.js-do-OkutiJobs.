name: OkutiJobs E2E — vaga, IA e matching

on:
  workflow_dispatch:

jobs:
  job-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: https://www.okutijobs.com
      E2E_COMPANY_EMAIL: ${{ secrets.E2E_COMPANY_EMAIL }}
      E2E_COMPANY_PASSWORD: ${{ secrets.E2E_COMPANY_PASSWORD }}
      E2E_CANDIDATE_EMAIL: ${{ secrets.E2E_CANDIDATE_EMAIL }}
      E2E_CANDIDATE_PASSWORD: ${{ secrets.E2E_CANDIDATE_PASSWORD }}
      E2E_EXPECT_MATCH: "1"
      E2E_EXPECT_EMAIL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: okutijobs-playwright-report
          path: playwright-report/
